anchors:
  ref_1_face_master:
    role: FACE_MASTER
    anchor_tier: absolute
    priority: 1
    required_default: true
    path: ${PROJECT_ROOT}/anchors/face/front/A-Core_01_0deg_MASTER.png
    view_bucket: front
    view_side: center
    body_plane: frontal
    owns:
      - face_identity
      - facial_layout
      - facial_geometry
    supports:
      - front_identity_lock
      - front_face_master
  ref_2_full_body_master:
    role: FULL_BODY_MASTER
    anchor_tier: absolute
    priority: 2
    required_default: true
    path: ${PROJECT_ROOT}/anchors/full/Task-63987060-116-1.png
    view_bucket: front
    view_side: center
    body_plane: frontal
    owns:
      - body_proportion
      - body_architecture
      - full_body_framing
      - body_constitution
      - body_tone_baseline
    supports:
      - body_gold_front_core
      - constitution_master
  ref_3_upper_support_97:
    role: UPPER_SUPPORT
    anchor_tier: support
    priority: 3
    required_default: false
    path: ${PROJECT_ROOT}/anchors/upper/Task-63987060-97-1.png
    view_bucket: front
    view_side: center
    body_plane: frontal
    owns:
      - clavicle_boundary
      - shoulder_line
      - upper_body_edge
    supports:
      - shoulder_drift
      - neck_drift
      - clavicle_drift
  ref_4_face_profile_side90_left:
    role: FACE_SUPPORT
    anchor_tier: support
    priority: 4
    required_default: false
    path: ${PROJECT_ROOT}/anchors/face/profile_like/strict_side_90_left_support_v2.png
    view_bucket: profile_like
    view_side: left
    body_plane: sagittal
    owns:
      - profile_identity
      - profile_geometry
    supports:
      - side90_shadow_face
      - profile_like_identity
  ref_5_face_profile_side90_right:
    role: FACE_SUPPORT
    anchor_tier: support
    priority: 4
    required_default: false
    path: ${PROJECT_ROOT}/anchors/face/profile_like/strict_side_90_right_support_v2.png
    view_bucket: profile_like
    view_side: right
    body_plane: sagittal
    owns:
      - profile_identity
      - profile_geometry
    supports:
      - strict_side90_right_shadow_face
      - profile_like_identity

rules:
  face_truth_anchor: ref_1_face_master
  body_truth_anchor: ref_2_full_body_master
  upper_support_anchor: ref_3_upper_support_97
  face_conflict_winner: ref_1_face_master
  body_conflict_winner: ref_2_full_body_master
  face_identity_policy: absolute_only
  body_master_policy: absolute_only
  support_anchor_policy: assist_only
  upper_support_policy: single_active_support_only
  upper_support_activation:
    - shoulder_drift
    - neck_drift
    - clavicle_drift
    - upper_body_boundary_drift
