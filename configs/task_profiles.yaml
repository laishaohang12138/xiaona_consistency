review_policy:
  main_priority: body_gold_fullbody
  consistency_mode: soft_gate
  strict_fail_min_conf: 0.18
  face_no_signal_conf: 0.08
  allow_classic_cv_fallback: false
  fatal_on_engine_unavailable: true

profile_policy:
  identity_lock:
    identity_anchor_pool: face
    quality_anchor_pool: face
    tone_anchor_pool: face
    soft_quality_hits_to_warn: 1
    skin_lighting_high_caps_pass: false
    skin_sample_high_caps_pass: false
    allowed_view_buckets:
      - front
      - three_quarter
      - side_90
    soft_review_buckets: []
    pass_cap_mode: none
    quota_bucket: IDENTITY_LOCK
    hard_quality_flags:
      - FACE_UNDEREXPOSED_DARK
      - FACE_NO_RELIABLE_SIGNAL
  upper_body_product:
