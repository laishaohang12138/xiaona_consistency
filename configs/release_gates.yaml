schema_version: qa_release_gates_v2

release_gates:
  BODY_GOLD.front_core:
    release_state: primary
    machine_status_ceiling: PASS
    local_decision_authority: NONE
    external_review_route: PRIORITY_REVIEW
    may_emit_final_admission: false
    may_emit_final_image_set_membership: false
    training_admission_allowed: false
    manual_training_admission_required: false
    parameter_fitting_allowed: false
    optuna_fit_allowed: false
    requires_frozen_benchmark: false
    requires_curated_winner_bank: false
    required_lane_families:
      - front
    notes: >
      Front-core evidence receives priority external review when screening
      evidence is complete. This project does not decide admission or membership.

  BODY_GOLD.three_quarter_review:
    release_state: review
    machine_status_ceiling: WARN
    local_decision_authority: NONE
    external_review_route: HOLD_FOR_MORE_EVIDENCE
    may_emit_final_admission: false
    may_emit_final_image_set_membership: false
    training_admission_allowed: false
    manual_training_admission_required: false
    parameter_fitting_allowed: false
    optuna_fit_allowed: false
    requires_frozen_benchmark: true
    requires_curated_winner_bank: false
    required_lane_families:
      - three_quarter
    notes: >
      Three-quarter evidence remains on hold until canonical truth evidence and
      frozen benchmark coverage are stronger.

  BODY_GOLD.side90_shadow:
    release_state: shadow
    machine_status_ceiling: WARN
    local_decision_authority: NONE
    external_review_route: SHADOW_EVIDENCE_ONLY
    may_emit_final_admission: false
    may_emit_final_image_set_membership: false
    training_admission_allowed: false
    manual_training_admission_required: false
    parameter_fitting_allowed: false
    optuna_fit_allowed: false
    requires_frozen_benchmark: true
    requires_curated_winner_bank: false
    required_lane_families:
      - side
    notes: >
      Side-90 output is shadow evidence and cannot express final image-set
      membership or training admission.

  BODY_GOLD.back180_shadow:
    release_state: shadow
    machine_status_ceiling: WARN
    local_decision_authority: NONE
    external_review_route: SHADOW_EVIDENCE_ONLY
    may_emit_final_admission: false
    may_emit_final_image_set_membership: false
    training_admission_allowed: false
    manual_training_admission_required: false
    parameter_fitting_allowed: false
    optuna_fit_allowed: false
    requires_frozen_benchmark: true
    requires_curated_winner_bank: false
    required_lane_families:
      - back
    notes: >
      Back-180 output is shadow evidence and cannot express final image-set
      membership or training admission.

  BRIDGE.simple_outfit:
    release_state: primary
    machine_status_ceiling: PASS
    local_decision_authority: NONE
    external_review_route: PRIORITY_REVIEW
    may_emit_final_admission: false
    may_emit_final_image_set_membership: false
    training_admission_allowed: false
    manual_training_admission_required: false
    parameter_fitting_allowed: false
    optuna_fit_allowed: false
    requires_frozen_benchmark: false
    requires_curated_winner_bank: false
    required_lane_families:
      - front
      - three_quarter
    notes: >
      Stable simple-outfit continuity receives priority external review.

  BRIDGE.review:
    release_state: review
    machine_status_ceiling: WARN
    local_decision_authority: NONE
    external_review_route: STANDARD_REVIEW
    may_emit_final_admission: false
    may_emit_final_image_set_membership: false
    training_admission_allowed: false
    manual_training_admission_required: false
    parameter_fitting_allowed: false
    optuna_fit_allowed: false
    requires_frozen_benchmark: false
    requires_curated_winner_bank: false
    required_lane_families:
      - front
      - three_quarter
      - side
      - back
    notes: Generic full-body outfit evidence is routed for standard external review.

  UPPER_BODY_PRODUCT:
    release_state: review
    machine_status_ceiling: WARN
    local_decision_authority: NONE
    external_review_route: STANDARD_REVIEW
    may_emit_final_admission: false
    may_emit_final_image_set_membership: false
    training_admission_allowed: false
    manual_training_admission_required: false
    parameter_fitting_allowed: false
    optuna_fit_allowed: false
    requires_frozen_benchmark: false
    requires_curated_winner_bank: false
    required_lane_families:
      - front
      - three_quarter
    notes: Upper-body product evidence is routed for standard external review.

  IDENTITY_LOCK:
    release_state: review
    machine_status_ceiling: WARN
    local_decision_authority: NONE
    external_review_route: STANDARD_REVIEW
    may_emit_final_admission: false
    may_emit_final_image_set_membership: false
    training_admission_allowed: false
    manual_training_admission_required: false
    parameter_fitting_allowed: false
    optuna_fit_allowed: false
    requires_frozen_benchmark: false
    requires_curated_winner_bank: false
    required_lane_families:
      - front
      - three_quarter
      - side
    notes: Identity-lock output is screening evidence for external review.

  IDENTITY_FILTER_ONLY:
    release_state: filter_only
    machine_status_ceiling: WARN
    local_decision_authority: NONE
    external_review_route: SHADOW_EVIDENCE_ONLY
    may_emit_final_admission: false
    may_emit_final_image_set_membership: false
    training_admission_allowed: false
    manual_training_admission_required: false
    parameter_fitting_allowed: false
    optuna_fit_allowed: false
    requires_frozen_benchmark: false
    requires_curated_winner_bank: false
    required_lane_families:
      - front
      - three_quarter
      - side
    notes: Identity-filter output is diagnostic shadow evidence only.
